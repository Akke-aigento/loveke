<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="loveke-reel" content="1080x1920" data-duration="19" data-fps="30">
<title>Reel: 3 dingen over Loveke</title>
<link rel="stylesheet" href="../../../brand.css">
<style>
  body{background:#FFF8F0}
  #stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:#FFF8F0;font-family:'DM Sans',sans-serif;color:#1A1A1A}
  .layer{position:absolute;inset:0;opacity:0}
  .big{font-family:'Lilita One',sans-serif;line-height:.95}
  .hand{font-family:'Caveat',cursive;font-weight:700;line-height:1}
  .w{display:inline-block}
  .num{position:absolute;top:250px;left:80px;width:220px;height:220px;border-radius:50%;border:8px solid #1A1A1A;background:#FFF8F0;box-shadow:12px 12px 0 #1A1A1A;display:flex;align-items:center;justify-content:center;font-family:'Lilita One',sans-serif;font-size:150px}
  .line{position:absolute;left:80px;right:80px;font-family:'Lilita One',sans-serif;font-size:120px;line-height:1}
  .sub{position:absolute;left:80px;right:80px;font-family:'Caveat',cursive;font-weight:700;font-size:76px}
  .photo{position:absolute;display:block}
</style>
</head>
<body>
<div id="stage">
  <div class="dots" style="position:absolute;inset:0"></div>

  <!-- Haak -->
  <div class="layer" id="hook">
    <div class="big wm" id="h1" style="position:absolute;top:470px;width:100%;text-align:center;font-size:520px">3</div>
    <div class="big" style="position:absolute;top:1010px;width:100%;text-align:center;font-size:130px">
      <span class="w" id="h2">dingen</span> <span class="w" id="h3">over</span><br><span class="w" id="h4">Loveke</span>
    </div>
    <div class="hand" id="h5" style="position:absolute;top:1300px;width:100%;text-align:center;font-size:72px;color:#E3404B">die je nog niet wist</div>
  </div>

  <!-- 1 -->
  <div class="layer" id="s1" style="background:#FF7033">
    <div class="num">1</div>
    <div class="line" style="top:530px"><span class="w">Pas</span> <span class="w">als</span> <span class="w">jij</span> <span class="w">bestelt,</span></div>
    <div class="line" style="top:670px;color:#FFF8F0"><span class="w">wordt</span> <span class="w">hij</span> <span class="w">gemaakt.</span></div>
    <img class="photo" src="../../../../product-photos/tee-1.png" alt="" style="left:270px;top:900px;width:540px">
    <div class="sub" style="top:1460px;text-align:center;color:#1A1A1A">binnen 5 tot 20 werkdagen bij jou</div>
  </div>

  <!-- 2 -->
  <div class="layer" id="s2" style="background:#FFD43D">
    <div class="num">2</div>
    <div class="line" style="top:560px"><span class="w">Verzending?</span></div>
    <div class="line" style="top:700px;font-size:230px;color:#E3404B"><span class="w">Gratis.</span></div>
    <img class="photo" src="../../../../product-photos/hoodie-1.png" alt="" style="left:260px;top:960px;width:560px">
    <div class="sub" style="top:1460px;text-align:center;color:#1A1A1A">geen minimumbedrag</div>
  </div>

  <!-- 3 -->
  <div class="layer" id="s3" style="background:#FF85A1">
    <div class="num">3</div>
    <div class="line" style="top:530px"><span class="w">Met</span> <span class="w">twee?</span></div>
    <div class="line" style="top:680px;font-size:150px;color:#FFF8F0;-webkit-text-stroke:5px #1A1A1A"><span class="w">7%</span> <span class="w">korting</span></div>
    <img class="photo" id="p3a" src="../../../../product-photos/tee-3.png" alt="" style="left:90px;top:940px;width:460px">
    <img class="photo" id="p3b" src="../../../../product-photos/hoodie-3.png" alt="" style="left:530px;top:940px;width:460px">
    <div class="sub" style="top:1450px;text-align:center;color:#1A1A1A">automatisch, zonder code</div>
  </div>

  <!-- Eindkaart -->
  <div class="layer" id="end" style="background:#1A1A1A">
    <div class="big wm" id="e1" style="position:absolute;top:660px;width:100%;text-align:center;font-size:250px">Loveke</div>
    <div class="hand" id="e2" style="position:absolute;top:950px;width:100%;text-align:center;font-size:72px;color:#FFD43D">Born from Love. Worn on the Street.</div>
    <div id="e3" style="position:absolute;top:1130px;width:100%;text-align:center;font-size:50px;color:#FFF8F0">shop op <b>loveke.be</b></div>
  </div>
</div>

<script>
const T = { hook: [0, 2.6], s1: [2.6, 7.0], s2: [7.0, 11.0], s3: [11.0, 15.4], end: [15.4, 19] };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (el, u, delay, dur = .32) => {
  const p = clamp((u - delay) / dur);
  el.style.opacity = p > 0 ? 1 : 0;
  el.style.transform = `scale(${0.6 + 0.4 * easeBack(p)}) translateY(${(1 - easeOut(p)) * 40}px)`;
};
const slide = (el, u, delay, from, dur = .45) => {
  const p = clamp((u - delay) / dur);
  el.style.opacity = p > 0 ? 1 : 0;
  el.style.transform = `translateX(${(1 - easeOut(p)) * from}px) rotate(${(1 - p) * (from > 0 ? 8 : -8)}deg)`;
};
const vis = (id, t) => {
  const [a, b] = T[id];
  const el = document.getElementById(id);
  const u = t - a;
  const last = id === 'end';
  const inO = clamp(u / .18), outO = last ? 1 : 1 - clamp((u - (b - a - .18)) / .18);
  el.style.opacity = (t >= a && (t < b || last)) ? inO * outO : 0;
  return u;
};
window.setT = (t) => {
  let u = vis('hook', t);
  pop(document.getElementById('h1'), u, 0.05, .45);
  pop(document.getElementById('h2'), u, 0.5);
  pop(document.getElementById('h3'), u, 0.7);
  pop(document.getElementById('h4'), u, 0.9);
  pop(document.getElementById('h5'), u, 1.3);
  ['s1', 's2', 's3'].forEach((id, k) => {
    const uu = vis(id, t);
    const el = document.getElementById(id);
    pop(el.querySelector('.num'), uu, 0.05, .4);
    el.querySelectorAll('.line .w').forEach((w, j) => pop(w, uu, 0.35 + j * 0.16));
    const words = el.querySelectorAll('.line .w').length;
    el.querySelectorAll('.photo').forEach((p, j) => slide(p, uu, 0.5 + words * 0.16 + j * 0.15, j % 2 ? 700 : -700));
    pop(el.querySelector('.sub'), uu, 0.9 + words * 0.16 + 0.3);
  });
  u = vis('end', t);
  pop(document.getElementById('e1'), u, 0.1, .5);
  pop(document.getElementById('e2'), u, 0.6);
  pop(document.getElementById('e3'), u, 1.0);
};
window.setT(0);
</script>
</body>
</html>
