<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="loveke-reel" content="1080x1920" data-duration="14" data-fps="30">
<title>Reel stop-motion: van klik tot voor je deur</title><link rel="stylesheet" href="../../../brand.css">
<!-- reel-format: stop-motion (8 beelden/s). Feiten uit de weekpost: gemaakt op bestelling in jouw maat, 5 tot 20 werkdagen, gratis verzending. Echte productfoto's. -->
<style>
body{background:var(--cream);font-family:'DM Sans'}
.dots{position:absolute;inset:0}
.hd{position:absolute;left:70px;right:70px;top:260px;font:400 110px/.95 'Lilita One';color:var(--black)}
.n{position:absolute;left:70px;top:520px;width:120px;height:120px;border-radius:50%;background:var(--orange);border:6px solid var(--black);box-shadow:6px 6px 0 var(--black);font:400 70px/108px 'Lilita One';text-align:center;color:#fff}
.obj{position:absolute}
.phone{left:300px;top:640px;width:480px;height:860px;border:10px solid var(--black);border-radius:60px;background:#fff;box-shadow:12px 12px 0 var(--black);overflow:hidden}
.phone img{position:absolute;left:30px;top:120px;width:400px}
.phone .btn{position:absolute;left:40px;right:40px;bottom:60px;height:100px;border-radius:50px;background:var(--orange);border:5px solid var(--black);font:700 36px/90px 'DM Sans';color:#fff;text-align:center}
.size{width:150px;height:150px;border-radius:30px;border:6px solid var(--black);background:var(--yellow);font:400 80px/140px 'Lilita One';text-align:center;box-shadow:8px 8px 0 var(--black)}
.cal{left:260px;top:700px;width:560px;height:560px;background:#fff;border:8px solid var(--black);border-radius:30px;box-shadow:12px 12px 0 var(--black);text-align:center;overflow:hidden}
.cal .top{height:120px;background:var(--red);border-bottom:8px solid var(--black);font:700 40px/120px 'DM Sans';color:#fff}
.cal .d{font:400 220px/1 'Lilita One';margin-top:60px}
.cal .s{font:700 34px 'DM Sans'}
.box{left:240px;top:760px;width:600px;height:460px;background:#d9a46a;border:8px solid var(--black);border-radius:16px;box-shadow:12px 12px 0 var(--black)}
.flap{left:240px;top:700px;width:600px;height:80px;background:#c88f55;border:8px solid var(--black);border-radius:12px;transform-origin:bottom}
.label{left:330px;top:900px;width:420px;padding:20px 26px;background:#fff;border:5px solid var(--black);font:700 30px/1.3 'DM Sans';transform:rotate(-4deg)}
.label b{font:400 46px 'Lilita One';display:block}
.hoodie{left:340px;top:560px;width:400px}
.cap{position:absolute;left:70px;right:70px;bottom:360px;font:700 46px 'Caveat';color:var(--black);font-size:64px}
.end{position:absolute;inset:0;background:var(--orange);display:flex;flex-direction:column;justify-content:center;padding:0 70px;opacity:0}
.end h2{font:400 104px/.95 'Lilita One';color:#fff;margin:0;-webkit-text-stroke:4px var(--black);paint-order:stroke fill}
.end p{font:700 40px/1.4 'DM Sans';color:var(--black);margin-top:30px}
</style></head><body><div class="dots"></div>
<div class="hd" id="hd"></div><div class="n" id="n">1</div>
<div class="obj phone" id="phone"><img src="../../../../product-photos/hoodie-1.png"><div class="btn">In mijn mandje</div></div>
<div id="sizes"></div>
<div class="obj cal" id="cal"><div class="top">werkdagen</div><div class="d" id="d">5</div><div class="s">tot 20</div></div>
<img class="obj hoodie" id="hood" src="../../../../product-photos/hoodie-1.png">
<div class="obj box" id="box"></div><div class="obj flap" id="flap"></div><div class="obj label" id="label"><b>Voor jou</b>gratis verzending<br>gemaakt op bestelling</div>
<div class="cap" id="cap"></div>
<div class="end" id="end"><h2>Gemaakt voor jou.<br>Niet voor een rek.</h2><p>Vragen over je bestelling?<br>Stel ze in de comments.</p></div>
<script>
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const rnd=k=>{const x=Math.sin(k*733)*10000;return x-Math.floor(x)};
const SZ=['S','M','L','XL'];const sb=document.getElementById('sizes');const SE=SZ.map((s,i)=>{const d=document.createElement('div');d.className='obj size';d.textContent=s;d.style.left=(110+i*230)+'px';d.style.top='1150px';sb.appendChild(d);return d});
const ST=[[0,'Jij kiest\nje Loveke.','1','klik.'],[3,'Pas dan wordt hij\ngemaakt.','2','in jouw maat'],[6,'Even geduld.','3','5 tot 20 werkdagen'],[9,'Gratis tot\nbij jou thuis.','4','tok tok']];
const $=id=>document.getElementById(id);
window.setT=t=>{
 const f=Math.floor(t*8),q=f/8;const j=k=>`rotate(${(rnd(f+k)-.5)*3}deg) translate(${(rnd(f+k+9)-.5)*6}px,${(rnd(f+k+5)-.5)*6}px)`;
 let s=ST[0];for(const x of ST)if(q>=x[0])s=x;$('hd').innerHTML=s[1].replace('\n','<br>');$('n').textContent=s[2];$('cap').textContent=s[3];
 const st=ST.indexOf(s);
 $('phone').style.display=st===0?'block':'none';$('phone').style.transform=j(1)+` translateY(${Math.max(0,(0.6-q))*1500}px)`;
 SE.forEach((e,i)=>{e.style.display=st===1&&q>=3.3+i*0.4?'block':'none';e.style.transform=j(2+i)+(i===1&&q>4.9?' scale(1.25)':'')});
 $('hood').style.display=st===1?'block':'none';$('hood').style.transform=j(7);
 $('cal').style.display=st===2?'block':'none';$('cal').style.transform=j(3);
 const days=[5,7,9,11,13,15,17,20];$('d').textContent=st===2?days[Math.min(7,Math.floor((q-6)/0.35))]:'5';
 const show4=st===3;['box','flap','label'].forEach(k=>$(k).style.display=show4?'block':'none');
 if(show4){$('box').style.transform=j(4);$('flap').style.transform=`rotateX(${q<9.6?70:0}deg)`;$('label').style.display=q>=10?'block':'none';$('label').style.transform='rotate(-4deg) '+j(5);}
 $('end').style.opacity=t>=11.6?1:0;
};
</script></body></html>
