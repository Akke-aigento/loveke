<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="loveke-reel" content="1080x1920" data-duration="20" data-fps="30">
<title>Reel: POV je lief leent je hoodie</title>
<link rel="stylesheet" href="../../../brand.css">
<style>
  body{background:#1A1A1A}
  #stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:#1A1A1A;font-family:'DM Sans',sans-serif;color:#1A1A1A}
  .layer{position:absolute;inset:0;opacity:0}
  .big{font-family:'Lilita One',sans-serif;line-height:.95}
  .hand{font-family:'Caveat',cursive;font-weight:700;line-height:1}
  .w{display:inline-block}
  .tag{position:absolute;top:260px;left:80px;font-family:'Lilita One',sans-serif;font-size:96px;background:#FFF8F0;border:7px solid #1A1A1A;border-radius:28px;box-shadow:12px 12px 0 #1A1A1A;padding:10px 36px;transform:rotate(-3deg)}
  .line{position:absolute;left:80px;right:80px;font-family:'Lilita One',sans-serif;font-size:118px;line-height:1}
  .sub{position:absolute;left:80px;right:80px;font-family:'Caveat',cursive;font-weight:700;font-size:76px;text-align:center}
  .photo{position:absolute;display:block}
</style>
</head>
<body>
<div id="stage">
  <div class="dots" style="position:absolute;inset:0;opacity:.6"></div>

  <!-- Haak -->
  <div class="layer" id="hook" style="background:#FF7033">
    <div class="big" id="h1" style="position:absolute;top:420px;width:100%;text-align:center;font-size:330px;color:#FFF8F0;-webkit-text-stroke:8px #1A1A1A;text-shadow:16px 16px 0 #1A1A1A">POV:</div>
    <div class="big" style="position:absolute;top:820px;left:80px;right:80px;text-align:center;font-size:112px">
      <span class="w h">je</span> <span class="w h">lief</span> <span class="w h">wil</span> <span class="w h">je</span> <span class="w h">hoodie</span> <span class="w h" style="color:#FFF8F0">"even"</span> <span class="w h">lenen</span>
    </div>
    <div class="hand" id="h9" style="position:absolute;top:1330px;width:100%;text-align:center;font-size:80px;color:#1A1A1A">wat kan er misgaan?</div>
  </div>

  <!-- Dag 1 -->
  <div class="layer" id="s1" style="background:#FFD43D">
    <div class="tag">dag 1</div>
    <div class="line" style="top:470px"><span class="w">"Even,</span> <span class="w">beloofd."</span></div>
    <img class="photo" src="../../../../product-photos/hoodie-3.png" alt="" style="left:190px;top:640px;width:700px">
    <div class="sub" style="top:1400px">klinkt eerlijk</div>
  </div>

  <!-- Dag 14 -->
  <div class="layer" id="s2" style="background:#FF85A1">
    <div class="tag">dag 14</div>
    <div class="line" style="top:470px"><span class="w">"Welke</span> <span class="w">hoodie?"</span></div>
    <img class="photo" src="../../../../product-photos/hoodie-2.png" alt="" style="left:190px;top:640px;width:700px">
    <div class="sub" style="top:1400px">hij is van haar nu. of van hem. weg is weg.</div>
  </div>

  <!-- Oplossing -->
  <div class="layer" id="s3" style="background:#FFF8F0">
    <div class="tag" style="background:#E3404B;color:#FFF8F0">oplossing</div>
    <div class="line" style="top:470px"><span class="w">Eentje</span> <span class="w">voor</span> <span class="w">jullie</span> <span class="w">allebei.</span></div>
    <img class="photo" src="../../../../product-photos/hoodie-1.png" alt="" style="left:40px;top:790px;width:540px">
    <img class="photo" src="../../../../product-photos/hoodie-4.png" alt="" style="left:500px;top:790px;width:540px">
    <div class="sub" style="top:1400px;color:#1A1A1A">Classic Hoodie · €59,95</div>
  </div>

  <!-- Eindkaart -->
  <div class="layer" id="end" style="background:#1A1A1A">
    <div class="big wm" id="e1" style="position:absolute;top:660px;width:100%;text-align:center;font-size:250px">Loveke</div>
    <div class="hand" id="e2" style="position:absolute;top:950px;width:100%;text-align:center;font-size:72px;color:#FFD43D">Born from Love. Worn on the Street.</div>
    <div id="e3" style="position:absolute;top:1130px;width:100%;text-align:center;font-size:50px;color:#FFF8F0">shop op <b>loveke.be</b></div>
  </div>
</div>

<script>
// Funk 108 BPM: 4 tellen = 2,222 s. Elke scène = 8 tellen.
const B = 4 * 60 / 108;
const T = { hook: [0, 2 * B], s1: [2 * B, 4 * B], s2: [4 * B, 6 * B], s3: [6 * B, 8 * B], end: [8 * B, 20] };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (el, u, delay, dur = .3) => {
  const p = clamp((u - delay) / dur);
  el.style.opacity = p > 0 ? 1 : 0;
  el.style.transform = `scale(${0.6 + 0.4 * easeBack(p)}) translateY(${(1 - easeOut(p)) * 40}px)`;
};
const slide = (el, u, delay, from, dur = .45) => {
  const p = clamp((u - delay) / dur);
  el.style.opacity = p > 0 ? 1 : 0;
  el.style.transform = `translateX(${(1 - easeOut(p)) * from}px) rotate(${(1 - p) * (from > 0 ? 8 : -8) + (from > 0 ? 3 : -3)}deg)`;
};
const vis = (id, t) => {
  const [a, b] = T[id];
  const el = document.getElementById(id);
  const u = t - a;
  const last = id === 'end';
  const inO = clamp(u / .15), outO = last ? 1 : 1 - clamp((u - (b - a - .15)) / .15);
  el.style.opacity = (t >= a && (t < b || last)) ? inO * outO : 0;
  return u;
};
const beat = B / 4;
window.setT = (t) => {
  let u = vis('hook', t);
  pop(document.getElementById('h1'), u, 0.02, .4);
  document.querySelectorAll('#hook .h').forEach((w, j) => pop(w, u, beat * 1 + j * beat / 2));
  pop(document.getElementById('h9'), u, beat * 6);
  ['s1', 's2', 's3'].forEach((id) => {
    const uu = vis(id, t);
    const el = document.getElementById(id);
    const tag = el.querySelector('.tag');
    pop(tag, uu, 0.02, .35);
    if (uu >= 0) tag.style.transform += ' rotate(-3deg)';
    el.querySelectorAll('.line .w').forEach((w, j) => pop(w, uu, beat + j * beat / 2));
    el.querySelectorAll('.photo').forEach((p, j) => slide(p, uu, beat * 3 + j * beat / 2, j % 2 ? 700 : -700));
    pop(el.querySelector('.sub'), uu, beat * 5.5);
  });
  u = vis('end', t);
  pop(document.getElementById('e1'), u, 0.05, .45);
  pop(document.getElementById('e2'), u, beat * 1.5);
  pop(document.getElementById('e3'), u, beat * 3);
};
window.setT(0);
</script>
</body>
</html>
