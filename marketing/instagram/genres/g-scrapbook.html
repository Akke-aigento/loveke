<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="loveke-size" content="1080x1350">
<title>Scrapbook: van strip naar trui</title>
<link rel="stylesheet" href="../brand.css">
<!-- genre: collage/scrapbook op kraftpapier. Beelden: strip-1, strip-6 en hoodie-1 uit marketing/product-photos. -->
<style>
  body { margin:0; width:1080px; height:1350px; overflow:hidden; position:relative; background:#c9a57a; font-family:'DM Sans'; }
  .kraft { position:absolute; inset:0; background:
     radial-gradient(circle at 30% 20%, rgba(255,255,255,.18), transparent 40%),
     repeating-linear-gradient(17deg, rgba(0,0,0,.03) 0 2px, transparent 2px 7px),
     linear-gradient(160deg,#d3b086,#b88d5e); }
  .ph { position:absolute; background:#fff; padding:16px; box-shadow: 10px 12px 0 rgba(0,0,0,.2); }
  .ph img { display:block; width:100%; height:100%; object-fit:cover; }
  .tape { position:absolute; width:170px; height:52px; background:rgba(255,212,61,.75); transform:rotate(-12deg); box-shadow: 0 2px 0 rgba(0,0,0,.08); }
  .tape.p { background:rgba(255,133,161,.75); }
  .note { position:absolute; font:700 54px/1 'Caveat'; color:#1A1A1A; }
  .hoodie { position:absolute; right:30px; bottom:120px; width:560px; filter: drop-shadow(14px 14px 0 rgba(0,0,0,.25)); transform:rotate(6deg); }
  .t { position:absolute; left:70px; bottom:80px; font:400 84px/0.95 'Lilita One'; color:#FFF8F0; -webkit-text-stroke:5px #1A1A1A; paint-order:stroke fill; text-shadow: 8px 8px 0 #1A1A1A; width:600px; }
  svg.arw { position:absolute; }
</style>
</head>
<body>
  <div class="kraft"></div>
  <div class="ph" style="left:70px;top:70px;width:440px;height:440px;transform:rotate(-5deg)"><img src="../../../src/assets/comic/strip-1.webp" alt=""></div>
  <div class="tape" style="left:200px;top:52px"></div>
  <div class="ph" style="left:560px;top:120px;width:420px;height:420px;transform:rotate(4deg)"><img src="../../../src/assets/comic/strip-6.webp" alt=""></div>
  <div class="tape p" style="left:700px;top:100px;transform:rotate(9deg)"></div>
  <div class="note" style="left:90px;top:560px;transform:rotate(-4deg)">hier begon het</div>
  <svg class="arw" style="left:140px;top:600px" width="160" height="140" viewBox="0 0 160 140" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"><path d="M20 10 C 30 80, 80 110, 140 120"/><path d="M118 100 l24 20 l-30 8"/></svg>
  <img class="hoodie" src="../../product-photos/hoodie-1.png" alt="">
  <div class="note" style="right:90px;top:620px;transform:rotate(5deg)">en nu dragen we het</div>
  <div class="t">Ons verhaal, maar dan op een trui.</div>
</body>
</html>
