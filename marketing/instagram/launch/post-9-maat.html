<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="loveke-size" content="1080x1350">
<title>Maattip van Akke</title>
<link rel="stylesheet" href="../brand.css">

</head>
<body>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: #FFD43D; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 90px; gap: 44px; font-family: 'DM Sans', sans-serif; color: #1A1A1A">
<div style="background: #1A1A1A; color: #FFF8F0; font-family: 'Lilita One', sans-serif; font-size: 40px; letter-spacing: 2px; padding: 14px 32px; border-radius: 999px; align-self: flex-start; transform: rotate(-3deg)">MAATTIP</div>
<div style="background: #FFF8F0; border: 6px solid #1A1A1A; border-radius: 40px; box-shadow: 14px 14px 0 #1A1A1A; padding: 70px 64px; display: flex; flex-direction: column; gap: 30px">
<div style="font-family: 'Caveat', cursive; font-weight: 700; font-size: 86px; line-height: 1.02">"Ik ben 1m83. Ik draag L voor normaal, XL voor oversized."</div>
<div style="font-family: 'Lilita One', sans-serif; font-size: 46px; color: #FF7033">Akke</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px">
<div style="background: #FFF8F0; border: 5px solid #1A1A1A; border-radius: 26px; padding: 30px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 30px; font-weight: 600; color: #3D3D3D">Normale fit</div>
<div style="font-family: 'Lilita One', sans-serif; font-size: 110px; line-height: 1">L</div>
</div>
<div style="background: #FF7033; color: #FFFFFF; border: 5px solid #1A1A1A; border-radius: 26px; padding: 30px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 30px; font-weight: 600">Oversized</div>
<div style="font-family: 'Lilita One', sans-serif; font-size: 110px; line-height: 1">XL</div>
</div>
</div>
<div style="font-size: 36px; font-weight: 600">Alle maten per model: loveke.be/maatgids</div>
</div>
</body>
</html>
